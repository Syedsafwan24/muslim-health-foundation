# Local development services. Production uses Cloudflare R2 or any S3-compatible store.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mhf
      POSTGRES_PASSWORD: mhf
      POSTGRES_DB: mhf
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  # S3-compatible object store (MinIO images are no longer published on Docker Hub).
  storage:
    # Pinned: never :latest. Bump deliberately after reading the release notes.
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: mhfminio
      RUSTFS_SECRET_KEY: mhfminio-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    ports: ["9000:9000", "9001:9001"]
    volumes: [objectdata:/data]
volumes:
  pgdata:
  objectdata:
